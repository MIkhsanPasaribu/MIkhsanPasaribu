name: Generate snake animation

on:
  schedule: # execute every 12 hours (00:00 and 12:00 UTC)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

# Avoid overlapping runs racing to push to the output branch
concurrency:
  group: snake-animation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
